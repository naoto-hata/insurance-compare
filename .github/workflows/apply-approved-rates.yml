name: Apply independently approved interest rates to existing app
on:
  schedule:
    # Japan 10:47 every day; publish previously approved rates on their effective date
    - cron: '47 1 * * *'
  push:
    paths:
      - 'rates/approved.json'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: apply-approved-rates
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved rate records
        run: python scripts/validate_rates.py rates/approved.json
      - name: Update embedded single-premium data
        run: python scripts/apply_verified_rates.py
      - name: Publish only when the data actually changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A parts/ index.html
          if ! git diff --cached --quiet; then
            git commit -m "Apply verified single-premium rates [skip ci]"
            git push
          fi
      - name: Record blocked publication for review
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="利率の自動反映に失敗（要確認）"
          BODY="公式利率の自動反映がブロックされました。未確認値を公開せず停止しています。実行ログ: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUM=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \\"$TITLE\\") | .number" | head -1)
          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            gh issue comment "$NUM" --body "$BODY"
          fi
