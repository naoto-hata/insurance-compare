name: Audit published rate periods
on:
  schedule:
    - cron: '7 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check effective periods in deployed source
        run: python scripts/audit_public.py
      - name: Upload current release audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-rate-audit
          path: rates/public-audit.json
          if-no-files-found: ignore
      - name: Raise alert if stale
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "保険比較アプリの利率期間に要確認（$(date -u +%Y-%m-%d)）" --body "公開ファイルの適用期間・版数監査が失敗しました。GitHub Actionsのこの実行ログを確認してください。URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
