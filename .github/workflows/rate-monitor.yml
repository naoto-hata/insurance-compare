name: Monitor official single-premium insurance rate sources
on:
  schedule:
    # Japan 10:17 daily; catches publication delays after the 1st/16th
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official source accessibility
        run: python scripts/monitor_rates.py
      - name: Build read-only public monitoring status
        run: python scripts/publish_monitor_status.py
      - name: Publish status without changing insurance rates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official-source monitoring status [skip ci]"
            git push
          fi
      - name: Save monitoring report
        uses: actions/upload-artifact@v4
        with:
          name: rate-monitor-report
          path: |
            rate-monitor-report.md
            rate-monitor-report.json
      - name: Create or update a review issue per half month
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PERIOD=$(python -c "import json;print(json.load(open('rate-monitor-report.json'))['period'])")
          TITLE="一時払利率の公式確認: ${PERIOD}"
          EXISTING=$(gh issue list --state all --limit 100 --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body-file rate-monitor-report.md
          else
            gh issue edit "$EXISTING" --body-file rate-monitor-report.md
          fi
