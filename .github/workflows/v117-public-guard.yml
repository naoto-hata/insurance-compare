name: V117 public rate page guard
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'rates-current.html'
      - 'automation/verify_v117_public.py'
      - 'automation/test_v117_expiry.cjs'
      - 'automation/verify_live_v117.py'
      - 'automation/test_verify_live_v117.py'
      - '.github/workflows/v117-public-guard.yml'
  schedule:
    - cron: '35 0 * * *' # 09:35 Japan time; no write or deployment
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-public-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify effective dates and confidentiality of public rate-only page
        run: python automation/verify_v117_public.py
      - name: Simulate 11/30 to 12/1 Japan-time rate expiry
        run: node automation/test_v117_expiry.cjs
      - name: Test live-page integrity rejection cases without network access
        run: python -m unittest discover -s automation -p 'test_verify_live_v117.py' -v
      - name: Verify deployed rates page matches reviewed main file
        run: python automation/verify_live_v117.py
