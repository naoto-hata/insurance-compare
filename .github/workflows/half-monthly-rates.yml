name: Half-monthly insurance rate source audit
on:
  schedule:
    - cron: '15 1 * * *' # 10:15 Japan time, daily retry after 1st/16th
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rate-source-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed rate validation tests
        run: python -m unittest discover -s automation -p 'test_*.py' -v
      - name: Extract archived embedded rates for independent verification
        run: python automation/extract_single_rates.py
      - name: Report current-rate coverage (never auto-approve)
        run: python automation/rate_coverage.py
      - name: Check official sources and update audit report
        run: python automation/audit_sources.py
      - name: Extract and stage Moonshot from exact audited HTML (not published)
        shell: bash
        run: |
          if [ -f /tmp/insurance-rate-source-cache/moon.html ]; then
            python automation/parse_moonshot.py --html /tmp/insurance-rate-source-cache/moon.html
            python automation/stage_rates.py --candidates automation/moonshot-candidates.json
          else
            echo 'Moonshot source unavailable; rate update held for review'
          fi
      - name: Save audit result (not insurance rate values)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/source-audit.json automation/v117-rate-snapshot.json automation/rate-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh official rate-source audit"
            git push
          fi
