name: Half-monthly insurance rate source audit
on:
  schedule:
    - cron: '15 1 * * *' # 10:15 Japan time, daily retry after 1st/16th
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rate-source-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed rate validation tests
        run: python -m unittest discover -s automation -p 'test_*.py' -v
      - name: Extract archived embedded rates for independent verification
        run: python automation/extract_single_rates.py
      - name: Report current-rate coverage (never auto-approve)
        run: python automation/rate_coverage.py
      - name: Check official sources and update audit report
        run: python automation/audit_sources.py
      - name: Stage 54 verified conditions from audited source bytes (not published)
        run: python automation/stage_audited_sources.py
      - name: Confirm release remains disabled and no output gets committed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path("automation/source-audit.json").read_text(encoding="utf-8"))
          assert all(row.get("automatically_published") is False for row in source["sources"])
          stage = json.loads(Path("/tmp/insurance-rate-staged.json").read_text(encoding="utf-8"))
          assert stage["release_stage"] == "VALIDATED_NOT_PUBLISHED"
          assert len(stage["records"]) == 54
          print("Read-only audit passed. No rate or asset publication.")
          PY
