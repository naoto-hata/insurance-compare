name: Validate proposed rate data
on:
  push:
    paths:
      - 'rates/**'
      - 'scripts/validate_rates.py'
      - '.github/workflows/validate-rates.yml'
  pull_request:
    paths:
      - 'rates/**'
      - 'scripts/validate_rates.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_rates.py rates/proposed.json
