name: Capture Sony Life rate evidence (not approved)
on:
  workflow_dispatch:
  schedule:
    - cron: '27 1 1,16 * *'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/extract_sony_candidates.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sony-unapproved-evidence
          path: sony-evidence.json
          if-no-files-found: ignore
